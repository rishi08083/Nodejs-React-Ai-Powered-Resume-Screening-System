name: Full Deployment

on:
  push:
    branches:
      - dev

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Fetch Backend Variables and Create .env
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "Fetching backend environment variables..."
          echo "$VARS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > backend.env
          echo "This is the content of the backend.env file:"
          cat backend.env

      - name: Transfer Backend Files
        run: |
          scp -r ./Backend docker-compose.yml backend.env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/Backend

      - name: Deploy Backend to Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/Backend

            # Move the environment file to the right place
            mv ~/Backend/backend.env .env

            # Stop existing containers
            docker-compose down

            # Build and start the containers
            docker-compose up -d --build
          EOF

  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Fetch Frontend Variables and Create .env
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "Fetching frontend environment variables..."
          echo "$VARS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > frontend.env
          echo "This is the content of the frontend.env file:"
          cat frontend.env

      - name: Transfer Frontend Files
        run: |
          scp -r ./Frontend docker-compose.yml frontend.env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/Frontend

      - name: Deploy Frontend to Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/Frontend

            # Move the environment file to the right place
            mv ~/Frontend/frontend.env .env

            # Stop existing containers
            docker-compose down

            # Build and start the containers
            docker-compose up -d --build
          EOF
