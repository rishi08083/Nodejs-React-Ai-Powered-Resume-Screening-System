name: Dev Deployment

on:
  push:
    branches:
      - feature/testingdevdeploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Create .env file from all repository variables
      - name: Create .env file from all variables
        run: |
          echo "Creating .env file from repository variables..."

          # Define the list of expected variables (manually)
          variables=("DATABASE_URL" "JWT_SECRET" "NEXT_PUBLIC_API_URL" "NEXT_PUBLIC_BASE_URL")

          # Create the .env file
          for var in "${variables[@]}"; do
            value="${{ vars[$var] }}"
            echo "$var=$value" >> .env
          done

          # Display the .env file content
          echo "Generated .env file:"
          cat .env
