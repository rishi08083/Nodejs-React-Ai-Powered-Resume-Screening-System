name: Fetch Environment Variables

on:
  push:
    branches:
      - feature/testingdevdeploy

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: production  # Replace with your environment name

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch Variables from Repository
        run: |
          echo "Fetching all environment variables and creating a .env file..."
          printenv | grep -E '^(DATABASE_URL|JWT_SECRET|NEXT_PUBLIC_.*)=' > test.env

          echo "This is the content of test.env file:"
          cat test.env
