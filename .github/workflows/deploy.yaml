name: Fetch Repository Variables

on:
  push:
    branches:
      - feature/testingdevdeploy

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch Variables from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub-provided token or your PAT
        run: |
          echo "Fetching all repository variables using GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/environments/production/variables" \
            | jq -r '.variables[] | "\(.name)=\(.value)"' > test.env

          echo "This is the content of the test.env file:"
          cat test.env
